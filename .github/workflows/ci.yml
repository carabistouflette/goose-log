name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchain
          key: goose-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('GOOSE_REVISION', 'scripts/setup-goose.sh') }}
      - run: make setup
      - run: make check test
      - name: Optional UTC record consumer with pinned goose-time
        run: make test-utc
      - name: Optional UTC component benchmark correctness smoke
        run: make bench-utc-smoke
      - name: GCC optional UTC consumer sanitizers
        run: make test-utc-sanitize
      - name: Clang optional UTC consumer sanitizers
        run: make test-utc-sanitize
        env:
          SANITIZER_CC: clang
      - name: GCC protected-page tests
        run: make test-guarded
        env:
          GOOSE_CC: gcc
      - name: Clang protected-page tests
        run: make test-guarded
        env:
          GOOSE_CC: clang
      - name: GCC sanitizers (debug and optimized)
        run: make test-sanitize
      - name: Clang sanitizers (debug and optimized)
        run: make test-sanitize
        env:
          SANITIZER_CC: clang
      - name: GCC application-owned CLI adapter sanitizers
        run: make test-cli-sanitize
      - name: Clang application-owned CLI adapter sanitizers
        run: make test-cli-sanitize
        env:
          SANITIZER_CC: clang
      - name: Pinned synchronous comparison correctness smoke
        run: python3 bench/compare/run.py --iterations 10 --rounds 1 --cpu 0
      - name: Allocation probe counter and exact-output smoke
        run: python3 bench/alloc/run.py --iterations 10
      - name: CLI component profile correctness smoke
        run: python3 bench/cli/run.py --smoke --cpu 0 --build-cpu 0
      - name: Native runtime-input hot-path correctness smoke
        run: python3 bench/hotpath/run.py --baseline "$(git rev-parse HEAD)" --smoke --cpu 0 --build-cpu 0
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
      GOOSE_CC: clang
      SANITIZER_CC: clang
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify macOS ARM64 runner and record tools
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          sw_vers
          clang --version
          cmake --version
          python3 --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchain
          key: goose-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('GOOSE_REVISION', 'scripts/setup-goose.sh') }}
      - run: make setup
      - run: .toolchain/goose/build/goose version
      - name: Core type, ownership and byte/record oracles (JIT and native)
        run: make check-core test-core
      - name: Core protected-page tests (optimized and debug)
        run: make test-guarded
      - name: Core ASan and UBSan (debug and optimized)
        run: make test-sanitize
